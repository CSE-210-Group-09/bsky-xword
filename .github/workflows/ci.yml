name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:server --if-present
      - run: npm run test:db --if-present
      - name: Validate puzzle files when the validator is available
        run: npm run validate-puzzles --if-present
      - name: Install the Playwright browser
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:integration
      - run: npm run test:e2e
