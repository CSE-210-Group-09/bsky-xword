name: Daily mini prototype
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test prototypes/*/*.test.mjs
      - run: node --check prototypes/daily-mini/app.mjs
